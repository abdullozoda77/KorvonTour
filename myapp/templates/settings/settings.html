{% extends 'base.html' %}
{% block title %}Настройки — Korvon{% endblock %}
{% block nav_settings %}active{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Настройки</h1>
        <div class="page-sub">Управление аккаунтом и предпочтениями</div>
    </div>
</div>

<div class="card form-card">
    <h3>Профиль</h3>
    <form method="post" autocomplete="off" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group">
                <label for="id_image">Фото профиля</label>
                <input type="file" id="id_image" name="image" accept="image/*">
                {% if user.profile.image %}
                <img src="{{ user.profile.image.url }}" alt="Фото профиля" class="avatar-preview" style="margin-top:8px; width:80px; height:80px; border-radius:50%; object-fit:cover;">
                {% endif %}
            </div>
            <div class="form-group">
                <label for="first_name">Имя</label>
                <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}">
            </div>
            <div class="form-group">
                <label for="last_name">Фамилия</label>
                <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ user.email }}">
            </div>
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" value="{{ user.username }}" disabled>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
                Сохранить
            </button>
        </div>
    </form>
</div>
{% endblock %}
